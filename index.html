<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>CardBlanche</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>

:root{
  --bg:#0f1115;--panel:#181b22;--panel2:#20242d;--line:#2b303b;--text:#eef0f4;--muted:#9aa1ae;
  --accent:#5ee0a0;--accent2:#3bb47b;--warn:#f5b84b;--bad:#ff6b6b;--blue:#7aa7ff;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);padding:14px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1}
header h1 span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
main{padding:14px 14px 30px;max-width:640px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 4px 8px;font-weight:600}
h2:first-child{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:22px;font-weight:700}
.pct{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip.warn{color:var(--warn);border-color:#5b4723}.chip.bad{color:var(--bad);border-color:#5a2a2a}.chip.ok{color:var(--accent);border-color:#24523b}
.list>.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list>.item:last-child{border-bottom:0}
.icon{width:38px;height:38px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:19px;flex:none}
.mini{width:46px;height:30px;border-radius:6px;flex:none;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 1px 3px rgba(0,0,0,.4)}
.mini.thumb{width:66px;height:42px;border-radius:7px}
.mini::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 15% 0%,rgba(255,255,255,.28),transparent 55%)}
.mini .ch{position:absolute;left:12%;top:32%;width:20%;height:24%;border-radius:2px;background:linear-gradient(135deg,#f6e2a6,#b8933f)}
.mini .nw{position:absolute;right:4px;bottom:2px;font-size:6.5px;font-weight:800;font-style:italic;color:rgba(255,255,255,.9);letter-spacing:.2px}
.mini.thumb .nw{font-size:8px;right:5px;bottom:3px}
.mini .is{position:absolute;left:5px;top:3px;font-size:6px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.mini:not(.thumb) .is{display:none}
.ccard{position:relative;overflow:hidden;border-radius:16px;padding:16px 18px;aspect-ratio:1.586;max-height:230px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.35);margin-bottom:12px;cursor:pointer}
.ccard::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 10% -10%,rgba(255,255,255,.25),transparent 55%),radial-gradient(80% 60% at 110% 120%,rgba(0,0,0,.35),transparent 60%);pointer-events:none}
.ccard>*{position:relative}
.ccard .iss{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;opacity:.9}
.ccard .chipg{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#f6e2a6,#b8933f);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ccard .nwm{font-weight:800;font-style:italic;font-size:16px;letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ccard .meta,.ccard .nm,.ccard .iss{text-shadow:0 1px 2px rgba(0,0,0,.35)}
.grouph{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:14px 2px 4px;border-bottom:1px solid var(--line)}
.ccard .nm{font-weight:700;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ccard .meta{font-size:12px;opacity:.85}
button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--panel2);color:var(--text);cursor:pointer;border:1px solid var(--line)}
button.primary{background:var(--accent);color:#06281a;border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.sm{padding:6px 11px;font-size:13px;border-radius:10px}
button:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:13px;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(17,19,24,.97);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:11px;padding:4px 0;border-radius:12px}
nav a b{display:block;font-size:20px;line-height:26px;font-weight:400}
nav a.on{color:var(--accent);background:rgba(94,224,160,.08)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty .e{font-size:34px;margin-bottom:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line);animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 6px;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.hero{background:linear-gradient(135deg,#123526,#0f1d2b);border:1px solid #24523b}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e8ecf2;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:fade .2s}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font-size:13px}
.pick.on{border-color:var(--accent);background:rgba(94,224,160,.08)}
.searchwrap{position:relative;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.kv span:first-child{color:var(--muted)}
a.lnk{color:var(--blue)}
.shopbig{text-align:center;padding:22px 14px}
.shopbig .ccard{max-width:330px;margin:12px auto;text-align:left}
.pin{color:var(--warn);font-size:12px}

/* ---- CardBlanche additions ---- */
.ccard.img{background-size:cover;background-position:center;background-color:#222;padding:0;position:relative;min-height:0}
.ccard.img::before{display:none}
.cface{margin-bottom:14px;cursor:pointer}.cface .ccard{margin-bottom:6px}
.capt{padding:0 4px}
.l4tag{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;letter-spacing:1px;padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.mini.img{background-size:cover;background-position:center;background-color:#222}
.mini.img::before{display:none}
.sync{cursor:pointer}
.setup{max-width:520px;margin:30px auto}
.face-l4{font-variant-numeric:tabular-nums;letter-spacing:1.5px;font-size:13px;opacity:.9}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:6px 0 10px}
.tl .ev:before{content:"";position:absolute;left:-17px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--panel2);border:2px solid var(--muted)}
.tl .ev.k-opened:before{border-color:var(--accent)}.tl .ev.k-closed:before{border-color:var(--bad)}.tl .ev.k-product_switch:before{border-color:var(--blue)}
.tl .ev.k-bonus_spend_started:before,.tl .ev.k-bonus_spend_met:before{border-color:var(--warn)}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.actions button{font-size:13.5px;padding:10px 8px}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kvs span:nth-child(odd){color:var(--muted)}
.sheet.wide{max-width:760px}
/* pay run */
.payhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.payhead>.grow{flex-basis:100%}
.payhead .big{font-size:20px}
.prow{display:grid;grid-template-columns:22px 46px 1fr 120px;grid-template-areas:"o f n b" "o f d a";gap:2px 10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .o{grid-area:o;color:var(--muted);font-size:12px;text-align:right}
.prow .f{grid-area:f}.prow .n{grid-area:n;min-width:0}.prow .b{grid-area:b}.prow .d{grid-area:d;min-width:0}.prow .a{grid-area:a;display:flex;gap:6px;justify-content:flex-end}
.prow input{text-align:right;font-variant-numeric:tabular-nums;padding:8px 10px}
.prow input.missing{border-color:#5b4723}
.prow.due{background:linear-gradient(90deg,rgba(245,184,75,.10),transparent 70%)}
.prow.flag{background:linear-gradient(90deg,rgba(255,107,107,.10),transparent 70%)}
.pbtn{padding:6px 10px;font-size:12.5px;border-radius:9px}
.pbtn.on{background:var(--accent);color:#06281a;border-color:var(--accent);font-weight:700}
.pbtn.flagon{background:#5a2a2a;color:#ffd6d6;border-color:var(--bad)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px}
.tot b{font-size:20px;font-variant-numeric:tabular-nums}
.frow{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;padding:6px 0}
.frow input{text-align:right}
.rem{font-variant-numeric:tabular-nums}
.rem.ok{color:var(--accent)}.rem.bad{color:var(--warn)}
.ord{display:flex;flex-direction:column;gap:2px}
.ord button{padding:0 6px;font-size:11px;line-height:16px;border-radius:5px}
.bars{display:flex;align-items:flex-end;gap:3px;height:48px;margin:8px 0}
.bars i{flex:1;background:var(--accent2);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.legend{display:flex;gap:10px;flex-wrap:wrap}
@media (min-width:900px){
  body{font-size:15px}
  main{max-width:1100px;padding:20px 28px 40px}
  main.narrow{max-width:700px}
  nav{left:50%;right:auto;transform:translateX(-50%);width:640px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
  .prow{grid-template-columns:28px 52px minmax(220px,1.6fr) minmax(170px,1fr) 150px 200px;grid-template-areas:"o f n d b a";padding:8px 8px}
  .payhead>.grow{flex-basis:auto}
  .payhead .big{font-size:22px}
  .paygrid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  .paygrid .side{position:sticky;top:70px}
}
</style>
</head>
<body>
<header>
  <h1>Card<span>Blanche</span></h1>
  <div class="sync" id="sync" title="Sync status"><i class="dot" id="syncdot"></i><span id="synctxt">…</span></div>
</header>
<main id="app"></main>
<nav id="nav">
  <a href="#best" data-v="best"><b>⚡</b>Best</a>
  <a href="#wallet" data-v="wallet"><b>💳</b>Wallet</a>
  <a href="#pay" data-v="pay"><b>🧾</b>Pay</a>
  <a href="#points" data-v="points"><b>✦</b>Points</a>
  <a href="#more" data-v="more"><b>☰</b>More</a>
</nav>
<div id="layer"></div>
<script src="catalog.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
